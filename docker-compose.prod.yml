services:
  n8n-main:
    image: n8nio/n8n:local
    container_name: n8n_prod_main
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Configurações de autenticação existentes
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin@integre.me
      - N8N_BASIC_AUTH_PASSWORD=vG8c5RHEbU3nUg5
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_SECURE_COOKIE=false
      - N8N_PROTOCOL=https
      - N8N_HOST=api.integre.me
      - WEBHOOK_URL=https://api.integre.me

      # Configurações de banco de dados PostgreSQL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-senhadificil}

      # Configurações de queue mode
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - redis
    networks:
      - n8n-network

  n8n-worker:
    image: n8nio/n8n:local
    container_name: n8n_prod_worker
    restart: always
    environment:
      # Configurações de autenticação (mesmas do main)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin@integre.me
      - N8N_BASIC_AUTH_PASSWORD=vG8c5RHEbU3nUg5
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_SECURE_COOKIE=false
      - N8N_PROTOCOL=https
      - N8N_HOST=api.integre.me
      - WEBHOOK_URL=https://api.integre.me

      # Configurações de banco de dados PostgreSQL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-senhadificil}

      # Configurações de queue mode (worker)
      - EXECUTIONS_MODE=queue
      - QUEUE_MODE=worker
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - redis
    networks:
      - n8n-network

  postgres:
    image: postgres:13
    container_name: n8n_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senhadificil}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: n8n_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
    external: true
  postgres_data:
  redis_data:

networks:
  n8n-network:
    driver: bridge
